<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <link class="icon" type="image/png" href="img/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JAKO VAULT</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    
<style>
        /* ==========================================
           1. CUSTOM PROPERTIES & THEMES
           ========================================== */
        :root[data-theme="dark"] {
            --jako-bg: rgba(0, 0, 0, 0.95);
            --jako-text: #ffffff;
            --jako-border: rgba(255, 255, 255, 0.02);
            --jako-glass: rgba(0, 0, 0, 0.5);
            --jako-led: rgba(255, 255, 255, 0.75);
            --gradient-start: rgba(255, 255, 255, 0.03);
            --gradient-mid: rgba(5, 5, 8, 0.85);
            --gradient-end: #000000;
        }

        :root[data-theme="white"] {
            --jako-bg: #f8f9fa;
            --jako-text: #000000;
            --jako-border: rgba(0, 0, 0, 0.08);
            --jako-glass: rgba(255, 255, 255, 0.4);
            --jako-led: rgba(0, 0, 0, 0.85);
            --gradient-start: rgba(0, 0, 0, 0.02);
            --gradient-mid: rgba(248, 249, 250, 0.85);
            --gradient-end: #ffffff;
        }

        /* ==========================================
           2. GLOBAL STYLES & RESET
           ========================================== */
        *, ::before, ::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            scroll-behavior: smooth; 
            letter-spacing: 0.05em;  
            overscroll-behavior: none;
            background-color: var(--jako-bg);
            color: var(--jako-text);
            transition: background-color 0.5s ease, color 0.5s ease;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        ::selection {
            background-color: var(--jako-text);
            color: var(--jako-bg);
        }

        #page-bg-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, var(--gradient-start) 15%, var(--gradient-mid) 80%, var(--gradient-end) 100%);
            z-index: -1;
            transform: translateZ(0);
        }

        :root[data-theme="dark"] .active-led {
            text-shadow: 0 0 10px var(--jako-led), 0 0 4px var(--jako-led) !important;
        }
        :root[data-theme="white"] .active-led {
            text-shadow: 0 0 6px var(--jako-led) !important;
        }

        /* ==========================================
           3. LAYOUT & RESPONSIVE CONTAINERS
           ========================================== */
        .vault-main {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .vault-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            position: relative;
            z-index: 10;
        }

        .vault-card-frame {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* ==========================================
           4. PANEL PACK & VECTOR TARGET (PROPORTION 1:3)
           ========================================== */
        #artepanel-pack-container {
            position: relative;
            width: 45vmin;
            height: 45vmin;
            aspect-ratio: 1 / 1;
            flex-shrink: 0;
            filter: drop-shadow(0 25px 55px rgba(0, 0, 0, 0.85));
            cursor: pointer;
        }

        #artepanel-mask-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            border-radius: 0px;
            /* Snappy 300ms transition with ultra-responsive cubic-bezier */
            transition: border-radius 0.3s cubic-bezier(0.2, 0, 0, 1), 
                        background-image 0.3s ease;
            background-image: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-mid) 50%, var(--gradient-end) 100%);
            -webkit-mask-image: -webkit-radial-gradient(white, black);
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
        }

        .svg-container {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            z-index: 20;
        }

        #laser-vector-target {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: currentColor;
            color: var(--jako-text);
            transition: all 0.5s ease;
            transform-origin: center;
        }

        /* ==========================================
           5. SVG INTERNAL ELEMENTS & MORPH ANIMATIONS
           ========================================== */
        .rotate-minus-90 {
            transform: rotate(-90deg);
            transform-origin: 200px 200px;
            -webkit-transform-origin: 200px 200px;
            transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1), 
                        opacity 0.3s ease;
        }

        /* Sandwatch group smooth zoom and fade out when hidden */
        .sandwatch-layer {
            transform-origin: center;
            opacity: 1;
            transform: scale(1);
            transition: opacity 0.3s ease, 
                        transform 0.3s cubic-bezier(0.2, 0, 0, 1);
            will-change: opacity, transform;
        }

        /* Hidden state for Sandwatch (Zoom Out + Fade) */
        .sandwatch-layer.is-hidden {
            opacity: 0;
            transform: scale(0.85);
            pointer-events: none;
        }

        /* Wave container smooth zoom and fade in when active */
        #wave-quantum-container {
            transform-origin: center;
            transition: opacity 0.3s ease, 
                        transform 0.3s cubic-bezier(0.2, 0, 0, 1);
            will-change: opacity, transform;
        }

        /* Hidden state for Concentric Waves (Zoom In + Fade) */
        #wave-quantum-container.is-hidden {
            opacity: 0;
            transform: rotate(-90deg) scale(0.9);
            pointer-events: none;
        }

        .stroke-20 {
            stroke: currentColor;
            opacity: 0.2;
        }

        .z-dial-text {
            fill: currentColor;
            font-weight: 900;
            font-size: 30px;
            letter-spacing: 0.35em;
            font-family: 'Orbitron', sans-serif;
        }
        
    </style>
</head>
<body>

    <div id="page-bg-overlay"></div>

    <main id="main-vault" class="vault-main"> 
        <div class="vault-wrapper">
            <div class="vault-card-frame">
                
                <div id="artepanel-pack-container">
                    <div id="artepanel-mask-wrapper">
                        
<div class="svg-container">
    <svg id="laser-vector-target" viewBox="0 0 400 400">
        
        <!-- Group B: Concentric Satellite View (Micro & Macro Wave) -->
        <g id="wave-quantum-container" class="rotate-minus-90"></g>

        <!-- View 0: Clean 2D Sandwatch View (Default Active First View) -->
        <g id="sandwatch-clean-group" class="sandwatch-layer">
            <path d="M 90,90 L 310,90 L 90,310 L 310,310 Z" class="stroke-20" />
            <path d="M 90,90 Q 200,125 310,90" class="stroke-20" />
            <path d="M 90,310 Q 200,275 310,310" stroke-dasharray="3 3" class="stroke-20" />
        </g>

        <!-- View 1: Concentric Wave View (Handled dynamically in JS) -->

        <!-- View 2: Lateral Sandwatch View + Level Marker (Now 3rd View) -->
        <g id="sandwatch-group" class="sandwatch-layer is-hidden">
            <path d="M 90,90 L 310,90 L 90,310 L 310,310 Z" class="stroke-20" />
            <path d="M 90,90 Q 200,125 310,90" class="stroke-20" />
            <path d="M 90,310 Q 200,275 310,310" stroke-dasharray="3 3" class="stroke-20" />
            <text id="z-dial" x="200" y="218" text-anchor="middle" class="z-dial-text">1P1</text>
        </g>

    </svg>
</div>

                    </div>
                </div>

            </div>
        </div>
    </main>

 <script>
    // =========================================================================
    // Z-DIAL ENGINE v8.2 — FLUID BIOCKINETIC TRANSDUCER
    // =========================================================================

    const VECTOR_TO_CLOCK_INDEX = {
        'P': 1,  'U': 2,  'L': 3,  'S': 4,
        'PL': 5, 'PU': 6, 'LU': 7, 'SU': 8,
        'PUL': 9,'LPS': 10,'SPU': 11,'ULS': 12
    };

    const VECTOR_DICTIONARY_EN = {
        'P':   'PACE',
        'U':   'PUSH',
        'L':   'PULL',
        'S':   'SURGE',
        'PL':  'PACE WITH PULL',
        'PU':  'PACE WITH PUSH',
        'LU':  'PULL WITH PUSH',
        'SU':  'SURGE WITH PUSH',
        'PUL': 'PACE WITH PUSH AND PULL',
        'LPS': 'PULL WITH PACE AND SURGE',
        'SPU': 'SURGE WITH PACE AND PUSH',
        'ULS': 'PUSH WITH PULL AND SURGE'
    };

    let biokineticWaveHistory = [];

    // -------------------------------------------------------------------------
    // 1. CONCENTRIC WAVES RENDERER (Zero Point Core Geometry)
    // -------------------------------------------------------------------------
    function renderBiokineticWaves() {
        const container = $('wave-quantum-container');
        if (!container || biokineticWaveHistory.length === 0) return;

        // Toggle wave visibility: visible only during viewMode 1
        if (viewMode === 1) {
            container.classList.remove('is-hidden');
        } else {
            container.classList.add('is-hidden');
        }

        let htmlContent = '';
        biokineticWaveHistory.forEach((dial, tIndex) => {
            const currentScale = tIndex * 1; 
            
            // Static base opacity calculated for active wave layers
            const baseOpacity = 1.0 - (tIndex * 0.07);
            if (baseOpacity <= 0) return;

            const viewFactor = 7; 
            const layers = [
                { id: 'internal',     r: (currentScale * 1.0) * viewFactor, opacity: baseOpacity * 0.70, value: dial.sets },
                { id: 'intermediate', r: (currentScale * 1.4) * viewFactor, opacity: baseOpacity * 0.55, value: dial.vector },
                { id: 'external',     r: (currentScale * 1.8) * viewFactor, opacity: baseOpacity * 0.40, value: dial.reps }
            ];

            layers.forEach(layer => {
                if (layer.r <= 0) return;
                const circumference = 2 * Math.PI * layer.r;
                const angle = (layer.value - 1) * 30; 
                const arcLength = (layer.value / 12) * circumference;
                const dashArray = `${arcLength} ${circumference}`;

                htmlContent += `
                    <circle 
                        id="wave-${layer.id}-t${tIndex}" 
                        cx="200" 
                        cy="200" 
                        r="${layer.r}" 
                        transform="rotate(${angle} 200 200)"
                        stroke="currentColor"
                        stroke-width="${tIndex === 0 ? 1.5 : 1.0}"
                        stroke-opacity="${layer.opacity}"
                        stroke-dasharray="${dashArray}"
                        stroke-linecap="round"
                        fill="none"
                    />`;
            });
        });
        container.innerHTML = htmlContent;
    }

    // -------------------------------------------------------------------------
    // 2. RESONANCE GRADIENT (Δ) ENGINE & BIOCIRCADIAN CYCLE
    // -------------------------------------------------------------------------
    function updateZ() {
        const now = new Date();
        const minutes = now.getMinutes();
        const seconds = now.getSeconds();
        const ms = now.getMilliseconds();

        let rawTension = 0;   
        let rawFrequency = 0; 
        let currentAction = 'P';

        if (seconds % 2 !== 0) {
            const progress1s = ms / 1000;
            rawFrequency = Math.floor(progress1s * 12) + 1;
            rawTension = 13 - rawFrequency;

            if (progress1s < 0.25) currentAction = 'P';      
            else if (progress1s < 0.50) currentAction = 'U'; 
            else if (progress1s < 0.75) currentAction = 'L'; 
            else currentAction = 'S';                        
        } else {
            rawFrequency = Math.floor((minutes % 12) + 1);

            if (seconds < 30) {
                const subSlot = Math.floor((seconds % 30) / 7.5);
                currentAction = ["PL", "PU", "LU", "SU"][subSlot] || "PL";
                rawTension = Math.floor((seconds % 10) + 2);
            } else {
                const subSlot = Math.floor(((seconds - 30) % 30) / 7.5);
                currentAction = ["PUL", "LPS", "SPU", "ULS"][subSlot] || "ULS";
                rawTension = Math.floor(((seconds - 30) % 10) + 3);
            }
        }

        const setsStage = Math.max(1, Math.min(12, rawFrequency)); 
        const repsStage = Math.max(1, Math.min(12, rawTension));   
        
        const biokineticCoordinate = `${setsStage}${currentAction}${repsStage}`;
        const vectorIndex = VECTOR_TO_CLOCK_INDEX[currentAction] || 1;
        const deltaGradient = (repsStage / setsStage).toFixed(2);

        const lastSavedDial = biokineticWaveHistory[0];
        if (!lastSavedDial || lastSavedDial.rawCoord !== biokineticCoordinate) {
            biokineticWaveHistory.unshift({ 
                sets: setsStage, 
                vector: vectorIndex, 
                reps: repsStage, 
                delta: deltaGradient,
                rawCoord: biokineticCoordinate 
            });
            if (biokineticWaveHistory.length > 12) biokineticWaveHistory.pop();
        }

        renderBiokineticWaves();

        const vectorText = VECTOR_DICTIONARY_EN[currentAction] || currentAction;
        const translatedHudText = `${repsStage} ${vectorText} AT FREQUENCY X${setsStage}`;

        let diagnosticMsg = "";
        if (deltaGradient > 1.0) {
            diagnosticMsg = `Tension Dominance (Δ=${deltaGradient}). Prescribing active push decompression.`;
        } else if (deltaGradient < 1.0) {
            diagnosticMsg = `Frequency Dominance (Δ=${deltaGradient}). Prescribing tensile pull anchoring.`;
        } else {
            diagnosticMsg = `Fascial Homeostasis (Δ=${deltaGradient}). High integrity fine tuning active.`;
        }

        const elDial = $('z-dial');
        const elDialHud = $('z-dial-hud');
        const elDiagnostic = $('z-dial-diagnostic');

        if (elDial) elDial.textContent = biokineticCoordinate;
        if (elDialHud) elDialHud.textContent = translatedHudText;
        if (elDiagnostic) elDiagnostic.textContent = diagnosticMsg;
    }

    // -------------------------------------------------------------------------
    // 4. INITIALIZATION & TRANSITION INTERACTION (SINGLE VS DOUBLE TAP)
    // -------------------------------------------------------------------------
// Update variable definition to make Clean Sandwatch mode 0
    let viewMode = 0; // 0: Clean Floating Sandwatch, 1: Concentric Drops/Waves, 2: Sandwatch with HUD Dial
    const $ = id => document.getElementById(id);

    // Dynamic style apply helper for initial load and mode toggling
    function applyContainerStyle(mode) {
        const maskWrapper = $('artepanel-mask-wrapper');
        if (!maskWrapper) return;

        if (mode === 0) {
            // View 0: Clean floating sandwatch (No box frame background)
            maskWrapper.style.backgroundImage = 'none';
            maskWrapper.style.borderRadius = "0px";
        } else {
            // Views 1 & 2: Restore dark gradient frame background
            maskWrapper.style.backgroundImage = 'linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-mid) 50%, var(--gradient-end) 100%)';
            maskWrapper.style.borderRadius = (mode === 1) ? "50%" : "0px";
        }
    }

    // Inside DOMContentLoaded initialization:
    document.addEventListener('DOMContentLoaded', () => {
        applyContainerStyle(viewMode); // Set initial transparent container style on boot
        updateZ();
        setInterval(updateZ, 1000);

        const container = $('artepanel-pack-container');
        if (container) {
            let tapTimer = null;
            let lastTapTime = 0;
            const DOUBLE_TAP_DELAY = 300;

            const toggleTheme = () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'white' : 'dark';
                document.documentElement.setAttribute('data-theme', newTheme);
            };

            // Updated view switcher logic with new order sequence
            const cycleViewMode = () => {
                // Sequence loop: 0 (Clean) -> 1 (Waves) -> 2 (HUD Dial) -> 0
                viewMode = (viewMode + 1) % 3;

                const sandwatchCleanGroup = $('sandwatch-clean-group');
                const sandwatchGroup = $('sandwatch-group');

                // View 0: Clean Sandwatch (No box background, vectors only)
                if (sandwatchCleanGroup) {
                    if (viewMode === 0) sandwatchCleanGroup.classList.remove('is-hidden');
                    else sandwatchCleanGroup.classList.add('is-hidden');
                }

                // View 1: Concentric Waves (Handled inside renderBiokineticWaves)
                renderBiokineticWaves();

                // View 2: Sandwatch with HUD Text Dial
                if (sandwatchGroup) {
                    if (viewMode === 2) sandwatchGroup.classList.remove('is-hidden');
                    else sandwatchGroup.classList.add('is-hidden');
                }

                // Apply wrapper geometry/background styling per mode
                applyContainerStyle(viewMode);
            };

            container.addEventListener('click', (e) => {
                e.preventDefault();
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTapTime;

                if (tapLength < DOUBLE_TAP_DELAY && tapLength > 0) {
                    clearTimeout(tapTimer);
                    toggleTheme();
                    if (navigator.vibrate) navigator.vibrate([10, 30, 10]);
                } else {
                    tapTimer = setTimeout(() => {
                        cycleViewMode();
                        if (navigator.vibrate) navigator.vibrate(10);
                    }, DOUBLE_TAP_DELAY);
                }

                lastTapTime = currentTime;
            });
        }
    });
</script>
</body>
</html>
